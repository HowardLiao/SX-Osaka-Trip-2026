<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 盛欣大阪 3D 空間數位導覽 ｜ Executive 3D Showcase</title>

  <!-- MapLibre GL JS 3D Engine -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(13, 17, 28, 0.78);
      --panel-border: rgba(245, 158, 11, 0.28);
      --panel-glow: rgba(245, 158, 11, 0.15);
      --gold-primary: #f59e0b;
      --gold-light: #fde68a;
      --gold-deep: #b45309;
      --cyan-neon: #38bdf8;
      --emerald-neon: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-blur: blur(24px) saturate(180%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      color: var(--text-main);
      user-select: none;
    }

    /* Fullscreen WebGL Canvas */
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Cinematic Vignette & Lighting Ambient Overlay */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(7, 9, 14, 0) 50%, rgba(7, 9, 14, 0.6) 92%, rgba(7, 9, 14, 0.95) 100%),
                  linear-gradient(180deg, rgba(7, 9, 14, 0.7) 0%, rgba(7, 9, 14, 0) 15%, rgba(7, 9, 14, 0) 85%, rgba(7, 9, 14, 0.8) 100%);
    }

    /* Floating Glass Header Capsule */
    .header-capsule {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 10px 5px 14px;
      background: var(--panel-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border);
      border-radius: 9999px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--panel-glow);
      max-width: calc(100vw - 28px);
    }

    .back-home-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 700;
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .back-home-pill:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--gold-primary);
      color: var(--gold-light);
      transform: translateY(-1px);
    }

    .brand-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.15);
    }

    /* Plan Tabs Bar inside capsule */
    .plan-pills-scroll {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .plan-pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .plan-pill {
      padding: 6px 13px;
      border-radius: 9999px;
      font-size: 12.5px;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .plan-pill:hover {
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.06);
    }

    .plan-pill.active {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.28), rgba(180, 83, 9, 0.35));
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.35);
    }

    /* Right HUD Tools: Style Switcher & Tour Button */
    .hud-controls-left {
      position: absolute;
      top: 76px;
      left: 18px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-btn {
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      color: #f1f5f9;
      background: var(--panel-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.25s ease;
    }

    .hud-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 15px var(--panel-glow);
    }

    .hud-btn.cinema-active {
      background: linear-gradient(135deg, #b45309, #d97706);
      border-color: var(--gold-light);
      color: #ffffff;
      animation: pulse-glow 2s infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.85); }
    }

    /* Map Style Switcher Floating Pill */
    .style-pill-box {
      display: flex;
      background: var(--panel-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 3px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .style-btn {
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .style-btn.active {
      background: rgba(245, 158, 11, 0.22);
      color: var(--gold-light);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    /* Floating Executive Side Drawer (Desktop) */
    .executive-drawer {
      position: absolute;
      top: 76px;
      right: 18px;
      width: 380px;
      height: calc(100vh - 96px);
      z-index: 20;
      background: rgba(11, 15, 25, 0.88);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--panel-glow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .executive-drawer.collapsed {
      transform: translateX(calc(100% + 40px));
      opacity: 0;
      pointer-events: none;
    }

    .drawer-toggle-btn {
      position: absolute;
      top: 76px;
      right: 18px;
      z-index: 19;
      padding: 9px 15px;
      border-radius: 12px;
      background: var(--panel-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border);
      color: var(--gold-light);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .drawer-toggle-btn:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--gold-primary);
      transform: translateY(-2px);
    }

    /* Drawer Header */
    .drawer-top-banner {
      padding: 16px 18px 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.08) 0%, rgba(0, 0, 0, 0) 100%);
    }

    .plan-meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      color: #92400e;
      background: var(--gold-light);
      padding: 2px 8px;
      border-radius: 9999px;
      margin-bottom: 6px;
    }

    .drawer-top-banner h3 {
      font-size: 15px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 3px;
    }

    .drawer-top-banner p {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .drawer-departure-pill {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 11.5px;
      color: #6ee7b7;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Drawer Spots Scroll Area */
    .spots-scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(245, 158, 11, 0.3) transparent;
    }

    .spots-scroll-container::-webkit-scrollbar {
      width: 4px;
    }
    .spots-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.3);
      border-radius: 9999px;
    }

    /* Spot Card Item */
    .spot-card {
      background: rgba(18, 24, 38, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .spot-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: transparent;
      transition: background 0.25s;
    }

    .spot-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(245, 158, 11, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    .spot-card.active {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(0, 0, 0, 0.4));
      border-color: var(--gold-primary);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
    }

    .spot-card.active::before {
      background: var(--gold-primary);
    }

    .spot-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .spot-number-badge {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      font-size: 10.5px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spot-time-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold-light);
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .spot-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .spot-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
    }

    .spot-thumb-box {
      width: 100%;
      height: 95px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      margin: 6px 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .spot-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .spot-card:hover .spot-thumb-box img {
      transform: scale(1.05);
    }

    .spot-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .spot-transit-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-weight: 600;
    }

    /* 3D Waypoint Beacons in WebGL */
    .waypoint-beacon {
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      pointer-events: auto;
      z-index: 10;
      transform: translate(-50%, -100%);
    }

    .waypoint-beacon:hover {
      z-index: 50;
    }

    /* Ground Radar Ring */
    .beacon-radar-ring {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%) rotateX(65deg);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      background: rgba(245, 158, 11, 0.2);
      animation: pulse-radar 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      pointer-events: none;
    }

    @keyframes pulse-radar {
      0% {
        transform: translateX(-50%) rotateX(65deg) scale(0.4);
        opacity: 1;
      }
      100% {
        transform: translateX(-50%) rotateX(65deg) scale(2.6);
        opacity: 0;
      }
    }

    /* Vertical Light Spire */
    .beacon-spire {
      width: 2px;
      height: 24px;
      background: linear-gradient(180deg, var(--gold-light), var(--gold-primary), transparent);
      box-shadow: 0 0 6px var(--gold-primary);
      margin-top: 3px;
    }

    /* Floating Glass Hologram Card */
    .beacon-pill {
      padding: 3px 9px;
      border-radius: 9999px;
      background: rgba(13, 17, 28, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold-primary);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6), 0 0 10px rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .waypoint-beacon:hover .beacon-pill {
      transform: scale(1.1) translateY(-2px);
      border-color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8), 0 0 18px var(--gold-primary);
    }

    .beacon-idx {
      font-size: 9.5px;
      font-weight: 900;
      color: #07090e;
      background: var(--gold-primary);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .beacon-name {
      font-size: 11.5px;
      font-weight: 800;
      color: #ffffff;
    }

    /* Mobile Bottom Sheet (Compact by default!) */
    .mobile-bottom-bar {
      display: none;
      position: absolute;
      bottom: 14px;
      left: 12px;
      right: 12px;
      z-index: 25;
      background: var(--panel-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      padding: 8px 12px;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    /* Fullscreen Modal for High-Res Photos */
    .photo-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(16px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .photo-modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      overflow: hidden;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9);
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    /* Tour Notification Toast */
    .tour-toast {
      display: none;
      position: absolute;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      padding: 7px 16px;
      background: linear-gradient(135deg, rgba(180, 83, 9, 0.95), rgba(217, 119, 6, 0.95));
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold-light);
      border-radius: 9999px;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(245, 158, 11, 0.5);
      align-items: center;
      gap: 10px;
    }

    /* Responsive Adaptation */
    @media (max-width: 860px) {
      .header-capsule {
        top: 8px;
        padding: 4px 8px;
        max-width: calc(100vw - 16px);
      }
      .hud-controls-left {
        top: 58px;
        left: 8px;
        gap: 6px;
      }
      .hud-btn {
        padding: 5px 10px;
        font-size: 11px;
        border-radius: 8px;
      }
      .style-pill-box {
        padding: 2px;
      }
      .style-btn {
        padding: 4px 8px;
        font-size: 10.5px;
      }
      .executive-drawer {
        display: none;
      }
      .drawer-toggle-btn {
        display: none;
      }
      .mobile-bottom-bar {
        display: flex;
      }
      /* Mobile modal drawer */
      body.mobile-sheet-open .executive-drawer {
        display: flex;
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-height: 60vh;
        border-radius: 20px 20px 0 0;
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen WebGL Map -->
  <div id="map"></div>

  <!-- Ambient Cinematic Vignette -->
  <div class="vignette-overlay"></div>

  <!-- Floating Glass Header Capsule -->
  <header class="header-capsule">
    <a href="index.html" class="back-home-pill">⬅️ 返回手冊</a>
    <div class="brand-divider"></div>
    <div class="plan-pills-scroll">
      <button class="plan-pill active" id="tab-planAPlus" onclick="switchPlan('planAPlus')">🏯 Plan A+ (08:00)</button>
      <button class="plan-pill" id="tab-planA" onclick="switchPlan('planA')">🏛️ Plan A (09:00)</button>
      <button class="plan-pill" id="tab-planB" onclick="switchPlan('planB')">🦈 Plan B (08:50)</button>
      <button class="plan-pill" id="tab-planC" onclick="switchPlan('planC')">🍁 Plan C (09:30)</button>
      <button class="plan-pill" id="tab-official5d" onclick="switchPlan('official5d')">🗺️ 盛欣五日全覽</button>
    </div>
  </header>

  <!-- Left HUD Controls: Style Switcher & Tour -->
  <div class="hud-controls-left">
    <div class="style-pill-box">
      <button class="style-btn active" id="btn-style-dark" onclick="switchBasemap('dark')">🌌 黑曜極光</button>
      <button class="style-btn" id="btn-style-satellite" onclick="switchBasemap('satellite')">🛰️ 高空航拍</button>
      <button class="style-btn" id="btn-style-voyager" onclick="switchBasemap('voyager')">🏛️ 米蘭暖琥珀</button>
    </div>

    <button class="hud-btn" id="btn-drone-tour" onclick="toggleDroneTour()">
      <span>🎬</span> 3D 航拍巡航
    </button>
    
    <button class="hud-btn" id="btn-orbit" onclick="toggleAutoOrbit()">
      <span>🔄</span> 360° 空間盤旋
    </button>
  </div>

  <!-- Desktop Drawer Toggle Button -->
  <button class="drawer-toggle-btn" id="drawer-toggle-btn" onclick="toggleDrawer()">
    <span>📋</span> 隱藏/展開清單
  </button>

  <!-- Floating Executive Drawer -->
  <aside class="executive-drawer" id="executiveDrawer">
    <div class="drawer-top-banner">
      <div class="plan-meta-badge" id="drawerPlanBadge">✨ 推薦首選方案</div>

       Map 初始化與底圖圖層配置
       ======================================================================== */

    /* ========================================================================
       2. 關西 3D Procedural 地標建築幾何模型（立體拔起 Extruded 3D Buildings）
       ======================================================================== */
    function generate3DBuildingsGeoJSON() {
      const features = [];

      function makeSquare(centerLon, centerLat, sizeMeters) {
        const dLat = (sizeMeters / 2) * 0.000009;
        const dLon = (sizeMeters / 2) * 0.0000109;
        return [
          [centerLon - dLon, centerLat - dLat],
          [centerLon + dLon, centerLat - dLat],
          [centerLon + dLon, centerLat + dLat],
          [centerLon - dLon, centerLat + dLat],
          [centerLon - dLon, centerLat - dLat]
        ];
      }

      // 大阪城天守閣 (Osaka Castle 3-tier Pagoda)
      const oc = [135.5262, 34.6873];
      features.push(
        { type: 'Feature', properties: { height: 25, base: 0, color: '#334155' }, geometry: { type: 'Polygon', coordinates: [makeSquare(oc[0], oc[1], 70)] } },
        { type: 'Feature', properties: { height: 50, base: 25, color: '#1e293b' }, geometry: { type: 'Polygon', coordinates: [makeSquare(oc[0], oc[1], 46)] } },
        { type: 'Feature', properties: { height: 75, base: 50, color: '#d97706' }, geometry: { type: 'Polygon', coordinates: [makeSquare(oc[0], oc[1], 28)] } },
        { type: 'Feature', properties: { height: 88, base: 75, color: '#fbbf24' }, geometry: { type: 'Polygon', coordinates: [makeSquare(oc[0], oc[1], 14)] } }
      );

      // 阿倍野 HARUKAS 300 (300m Skyscraper)
      const ab = [135.5134, 34.6460];
      features.push(
        { type: 'Feature', properties: { height: 120, base: 0, color: '#0369a1' }, geometry: { type: 'Polygon', coordinates: [makeSquare(ab[0], ab[1], 65)] } },
        { type: 'Feature', properties: { height: 220, base: 120, color: '#0284c7' }, geometry: { type: 'Polygon', coordinates: [makeSquare(ab[0], ab[1], 45)] } },
        { type: 'Feature', properties: { height: 300, base: 220, color: '#38bdf8' }, geometry: { type: 'Polygon', coordinates: [makeSquare(ab[0], ab[1], 30)] } }
      );

      // 通天閣 (Tsutenkaku Lattice Tower 108m)
      const ttk = [135.5063, 34.6525];
      features.push(
        { type: 'Feature', properties: { height: 30, base: 0, color: '#78350f' }, geometry: { type: 'Polygon', coordinates: [makeSquare(ttk[0], ttk[1], 36)] } },
        { type: 'Feature', properties: { height: 85, base: 30, color: '#b45309' }, geometry: { type: 'Polygon', coordinates: [makeSquare(ttk[0], ttk[1], 18)] } },
        { type: 'Feature', properties: { height: 108, base: 85, color: '#f59e0b' }, geometry: { type: 'Polygon', coordinates: [makeSquare(ttk[0], ttk[1], 10)] } }
      );

      // 梅田藍天大廈 (Umeda Sky Building 173m Twin Towers)
      const um = [135.4897, 34.7052];
      features.push(
        { type: 'Feature', properties: { height: 173, base: 0, color: '#0284c7' }, geometry: { type: 'Polygon', coordinates: [makeSquare(um[0] - 0.0003, um[1], 28)] } },
        { type: 'Feature', properties: { height: 173, base: 0, color: '#0284c7' }, geometry: { type: 'Polygon', coordinates: [makeSquare(um[0] + 0.0003, um[1], 28)] } },
        { type: 'Feature', properties: { height: 173, base: 145, color: '#38bdf8' }, geometry: { type: 'Polygon', coordinates: [makeSquare(um[0], um[1], 55)] } }
      );

      // 心齋橋總部飯店大本營 (Shinsaibashi Hub Tower)
      const sh = [135.5020, 34.6720];
      features.push(
        { type: 'Feature', properties: { height: 75, base: 0, color: '#10b981' }, geometry: { type: 'Polygon', coordinates: [makeSquare(sh[0], sh[1], 40)] } },
        { type: 'Feature', properties: { height: 90, base: 75, color: '#f59e0b' }, geometry: { type: 'Polygon', coordinates: [makeSquare(sh[0], sh[1], 20)] } }
      );

      // 海遊館 (Kaiyukan Pavilion)
      const ky = [135.4289, 34.6545];
      features.push(
        { type: 'Feature', properties: { height: 45, base: 0, color: '#1d4ed8' }, geometry: { type: 'Polygon', coordinates: [makeSquare(ky[0], ky[1], 65)] } },
        { type: 'Feature', properties: { height: 60, base: 45, color: '#38bdf8' }, geometry: { type: 'Polygon', coordinates: [makeSquare(ky[0], ky[1], 35)] } }
      );

      // 咲洲宇宙塔 (Cosmo Tower 256m)
      const cs = [135.4157, 34.6385];
      features.push(
        { type: 'Feature', properties: { height: 256, base: 0, color: '#6366f1' }, geometry: { type: 'Polygon', coordinates: [makeSquare(cs[0], cs[1], 48)] } }
      );

      return { type: 'FeatureCollection', features };
    }

    /* ========================================================================
       3. MapLibre 頂級底圖配置 (預設極致黑曜 Carto Dark Matter @2x)
       ======================================================================== */
    const TILE_SOURCES = {
      dark: {
        type: 'raster',
        tiles: ['https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        maxzoom: 15,
        attribution: '&copy; Esri Dark Canvas'
      },
      satellite: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: '&copy; Esri World Imagery'
      },
      voyager: {
        type: 'raster',
        tiles: ['https://services.arcgisonline.com/arcgis/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: '&copy; Esri Topo'
      }
    };

    let map; window.map = null;
    let currentLayerKey = 'dark'; // 預設黑曜夜景，專業度破表
    let currentPlanKey = 'planAPlus';
    let activeMarkers = [];
    let isOrbiting = false;
    let orbitAnimFrame = null;
    let isDroneTouring = false;
    let tourStep = 0;
    let tourTimeout = null;

    function createMapStyle(layerKey) {
      return {
        version: 8,
        sources: {
          'base-tiles': TILE_SOURCES[layerKey]
        },
        layers: [
          {
            id: 'base-tiles-layer',
            type: 'raster',
            source: 'base-tiles',
            minzoom: 0,
            maxzoom: 16
          }
        ]
      };
    }

    /* ========================================================================
       4. 初始化 MapLibre
       ======================================================================== */
    window.map = map = new maplibregl.Map({
      container: 'map',
      style: createMapStyle(currentLayerKey),
      center: LANDMARKS_DATA.planAPlus.center,
      zoom: LANDMARKS_DATA.planAPlus.zoom,
      pitch: LANDMARKS_DATA.planAPlus.pitch,
      bearing: LANDMARKS_DATA.planAPlus.bearing,
      antialias: true
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

    map.on('load', () => {
      init3DBuildingsLayer();
      initRouteLayers();
      renderCurrentPlan();
    });

    /* 加入 3D Extruded Buildings 向量層 */
    function init3DBuildingsLayer() {
      if (map.getSource('osaka-3d-buildings')) return;

      map.addSource('osaka-3d-buildings', {
        type: 'geojson',
        data: generate3DBuildingsGeoJSON()
      });

      map.addLayer({
        id: 'osaka-3d-buildings-layer',
        type: 'fill-extrusion',
        source: 'osaka-3d-buildings',
        paint: {
          'fill-extrusion-color': ['get', 'color'],
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'base'],
          'fill-extrusion-opacity': 0.88
        }
      });
    }

    /* 加入動態流光光束路徑 */
    function initRouteLayers() {
      if (map.getSource('plan-route-source')) return;

      map.addSource('plan-route-source', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] }
      });

      // 寬幅琥珀色光暈
      map.addLayer({
        id: 'route-glow-layer',
        type: 'line',
        source: 'plan-route-source',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#d97706',
          'line-width': 9,
          'line-opacity': 0.45,
          'line-blur': 5
        }
      });

      // 核心金黃光束
      map.addLayer({
        id: 'route-core-layer',
        type: 'line',
        source: 'plan-route-source',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#fde68a',
          'line-width': 3.2,
          'line-opacity': 0.95
        }
      });
    }

    /* ========================================================================
       5. 渲染與切換方案 (Plan Switching)
       ======================================================================== */
    function switchPlan(planKey) {
      if (!LANDMARKS_DATA[planKey]) return;
      currentPlanKey = planKey;
      stopDroneTour();

      // 更新按鈕樣式
      document.querySelectorAll('.plan-pill').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('tab-' + planKey);
      if (activeBtn) activeBtn.classList.add('active');

      renderCurrentPlan();

      const plan = LANDMARKS_DATA[planKey];
      map.flyTo({
        center: plan.center,
        zoom: plan.zoom,
        pitch: plan.pitch,
        bearing: plan.bearing,
        duration: 1600,
        essential: true
      });
    }

    function renderCurrentPlan() {
      const plan = LANDMARKS_DATA[currentPlanKey];
      if (!plan) return;

      // 更新抽屜標題
      document.getElementById('drawerPlanTitle').textContent = plan.title;
      document.getElementById('drawerPlanSubtitle').textContent = plan.subtitle;
      document.getElementById('drawerDeparture').innerHTML = '<span>⏰</span> 出發：' + (plan.departureInfo || '準時出發');
      document.getElementById('mobTitle').textContent = plan.title;
      document.getElementById('mobSub').textContent = '出發：' + (plan.departureInfo || '');

      // 清除舊 Markers
      activeMarkers.forEach(m => m.remove());
      activeMarkers = [];

      // 更新路線 GeoJSON
      const coords = plan.spots.map(s => s.lngLat || s.coords);
      if (map.getSource && map.getSource('plan-route-source')) {
        map.getSource('plan-route-source').setData({
          type: 'FeatureCollection',
          features: [{
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates: coords
            }
          }]
        });
      }

      // 生成抽屜卡片與 WebGL 標記
      const listContainer = document.getElementById('spotsList');
      listContainer.innerHTML = '';

      plan.spots.forEach((spot, idx) => {
        // 1. 生成 3D 全像光柱標記 (DOM Element)
        const el = document.createElement('div');
        el.className = 'waypoint-beacon';
        el.innerHTML = `
          <div class="beacon-pill">
            <span class="beacon-idx">${idx === 0 ? '★' : idx}</span>
            <span class="beacon-name">${spot.name}</span>
          </div>
          <div class="beacon-spire"></div>
          <div class="beacon-radar-ring"></div>
        `;

        el.addEventListener('click', () => {
          focusSpot(idx);
        });

        const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
          .setLngLat(spot.lngLat || spot.coords)
          .addTo(map);

        activeMarkers.push(marker);

        // 2. 生成抽屜卡片
        const card = document.createElement('div');
        card.className = 'spot-card' + (idx === 0 ? ' active' : '');
        card.id = 'spot-card-' + idx;
        card.onclick = () => focusSpot(idx);

        card.innerHTML = `
          <div class="spot-card-header">
            <div class="spot-title-row">
              <span class="spot-number-badge">${idx === 0 ? '起點' : idx}</span>
              <span class="spot-title">${spot.name}</span>
            </div>
            <span class="spot-time-badge">${spot.time}</span>
          </div>

          <div class="spot-thumb-box" onclick="event.stopPropagation(); openPhotoModal(${idx});">
            <img src="${(spot.image || spot.img)}" alt="${spot.name}" onerror="this.src='images/osaka_castle.jpg'">
            <div style="position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.6); padding:2px 8px; border-radius:6px; font-size:10px; color:#fde68a;">🔍 點擊放大</div>
          </div>

          <p class="spot-desc">${spot.desc}</p>
          <div class="spot-transit-tag">🚶 ${(spot.station || spot.transit)}</div>
        `;

        listContainer.appendChild(card);
      });
    }

    function focusSpot(idx) {
      const plan = LANDMARKS_DATA[currentPlanKey];
      const spot = plan.spots[idx];
      if (!spot) return;

      // 高亮卡片
      document.querySelectorAll('.spot-card').forEach((c, i) => {
        if (i === idx) c.classList.add('active');
        else c.classList.remove('active');
      });

      const card = document.getElementById('spot-card-' + idx);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      map.flyTo({
        center: (spot.lngLat || spot.coords),
        zoom: 15.5,
        pitch: 62,
        bearing: (map.getBearing() + 35) % 360,
        duration: 1800,
        essential: true
      });
    }

    /* ========================================================================
       6. 3D 航拍巡航導覽 (Cinematic Drone Tour)
       ======================================================================== */
    function toggleDroneTour() {
      if (isDroneTouring) {
        stopDroneTour();
      } else {
        startDroneTour();
      }
    }

    function startDroneTour() {
      const plan = LANDMARKS_DATA[currentPlanKey];
      if (!plan || !plan.spots.length) return;

      isDroneTouring = true;
      tourStep = 0;
      document.getElementById('btn-drone-tour').classList.add('cinema-active');
      document.getElementById('tourToast').style.display = 'flex';
      runTourStep();
    }

    function runTourStep() {
      if (!isDroneTouring) return;
      const plan = LANDMARKS_DATA[currentPlanKey];
      if (tourStep >= plan.spots.length) {
        tourStep = 0; // 循環或結束
      }

      const spot = plan.spots[tourStep];
      document.getElementById('tourToastText').textContent = `第 ${tourStep + 1}/${plan.spots.length} 站：${spot.name} (${spot.time})`;

      focusSpot(tourStep);

      tourStep++;
      tourTimeout = setTimeout(() => {
        if (isDroneTouring) runTourStep();
      }, 5000);
    }

    function stopDroneTour() {
      isDroneTouring = false;
      clearTimeout(tourTimeout);
      document.getElementById('btn-drone-tour').classList.remove('cinema-active');
      document.getElementById('tourToast').style.display = 'none';
    }

    /* ========================================================================
       7. 360° 空間盤旋 (Auto Orbit)
       ======================================================================== */
    function toggleAutoOrbit() {
      isOrbiting = !isOrbiting;
      const btn = document.getElementById('btn-orbit');
      if (isOrbiting) {
        btn.classList.add('cinema-active');
        orbitLoop();
      } else {
        btn.classList.remove('cinema-active');
        cancelAnimationFrame(orbitAnimFrame);
      }
    }

    function orbitLoop() {
      if (!isOrbiting) return;
      map.setBearing((map.getBearing() + 0.15) % 360);
      orbitAnimFrame = requestAnimationFrame(orbitLoop);
    }

    /* ========================================================================
       8. 切換底圖 (Basemap Switcher)
       ======================================================================== */
    function switchBasemap(key) {
      if (key === currentLayerKey || !TILE_SOURCES[key]) return;
      currentLayerKey = key;

      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-style-' + key).classList.add('active');

      map.setStyle(createMapStyle(key));
      map.once('style.load', () => {
        init3DBuildingsLayer();
        initRouteLayers();
        renderCurrentPlan();
      });
    }

    /* ========================================================================
       9. UI 抽屜控制與相片彈窗
       ======================================================================== */
    function toggleDrawer() {
      const d = document.getElementById('executiveDrawer');
      d.classList.toggle('collapsed');
    }

    function toggleMobileSheet() {
      document.body.classList.toggle('mobile-sheet-open');
    }

    function openPhotoModal(idx) {
      const spot = LANDMARKS_DATA[currentPlanKey].spots[idx];
      if (!spot) return;

      document.getElementById('modalImg').src = (spot.image || spot.img);
      document.getElementById('modalTitle').textContent = spot.name + ' (' + spot.time + ')';
      document.getElementById('modalDesc').textContent = spot.desc;
      document.getElementById('modalMeta').innerHTML = `
        <span style="background:rgba(245,158,11,0.2); color:#fde68a; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:700;">🚶 ${(spot.station || spot.transit)}</span>
        <span style="background:rgba(56,189,248,0.2); color:#38bdf8; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:700;">📍 盛欣專案專屬地標</span>
      `;
      document.getElementById('photoModal').style.display = 'flex';
    }

    function closePhotoModal(e) {
      document.getElementById('photoModal').style.display = 'none';
    }
  </script>
</body>
</html>
