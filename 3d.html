<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>盛欣網絡 2026 大阪五日行 ｜ 3D 空間微縮地標沙盒</title>
  <style>
    :root {
      --bg: #080c14;
      --card-bg: rgba(15, 23, 42, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-emerald: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      color: var(--text);
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 頂部導覽列與方案切換器 */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 20;
      pointer-events: none;
      flex-wrap: wrap;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .brand-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 7px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-decoration: none;
      color: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .brand-pill:hover {
      border-color: var(--accent-gold);
      transform: translateY(-1px);
    }
    .brand-pill .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.16);
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
    }

    /* 方案選擇切換按鈕群 */
    .plan-selector {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 4px;
      border-radius: 12px;
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      overflow-x: auto;
      max-width: 100%;
    }
    .plan-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .plan-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.08);
    }
    .plan-btn.active {
      color: #0b0f17;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .plan-btn.active.gold { background: var(--accent-gold); }
    .plan-btn.active.rose { background: #f43f5e; color: #fff; }
    .plan-btn.active.emerald { background: #10b981; color: #fff; }
    .plan-btn.active.cyan { background: #06b6d4; color: #0b0f17; }

    /* HUD 3D 地標指引標籤 */
    #hud-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .hud-marker {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.2s, transform 0.2s;
    }
    .hud-marker:hover {
      transform: translate(-50%, -108%) scale(1.08);
      z-index: 10;
    }
    .hud-tag {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      white-space: nowrap;
    }
    .hud-marker.active .hud-tag {
      border-color: var(--accent-gold);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.6);
      background: rgba(30, 41, 59, 0.96);
    }
    .hud-pin {
      width: 2px;
      height: 14px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.6), transparent);
    }

    /* 右側 / 底部 詳細資訊抽屜 */
    .details-panel {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 360px;
      max-height: calc(100% - 90px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 16px;
      z-index: 15;
      box-shadow: 0 20px 45px rgba(0,0,0,0.65);
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
    }
    .details-panel.minimized {
      transform: translateY(calc(100% - 48px));
      opacity: 0.9;
    }
    .panel-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .plan-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-toggle-panel {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-toggle-panel:hover {
      background: rgba(255,255,255,0.16);
      color: #fff;
    }
    .panel-header h2 {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
      line-height: 1.3;
    }
    .panel-header p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.45;
    }

    /* 時間軸節點列表 */
    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 280px;
      padding-right: 4px;
    }
    .timeline-list::-webkit-scrollbar {
      width: 4px;
    }
    .timeline-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }
    .timeline-item {
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 9px 11px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .timeline-item:hover, .timeline-item.active {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.45);
      transform: translateX(3px);
    }
    .time-tag {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--accent-gold);
      min-width: 46px;
      line-height: 1.3;
    }
    .time-content {
      flex: 1;
    }
    .node-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .node-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.4;
    }
    .node-transit {
      font-size: 10.5px;
      color: #38bdf8;
      margin-top: 3px;
      font-weight: 600;
    }

    /* 底部通訊與行動按鈕 */
    .action-bar {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .btn-action {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 11.5px;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-action:hover {
      background: rgba(255,255,255,0.12);
    }
    .btn-action.btn-primary {
      background: var(--accent-gold);
      color: #0b0f17;
      border-color: var(--accent-gold);
    }
    .btn-action.btn-primary:hover {
      background: #d97706;
    }

    .controls-hint {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 10;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 999px;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .brand-section {
        justify-content: space-between;
      }
      .details-panel {
        width: calc(100% - 28px);
        max-height: 48%;
        bottom: 8px;
        right: 14px;
      }
      .controls-hint {
        display: none;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

          { time: "10:00", loc: "minoo", title: "2. 勝尾寺（應頂山達摩總本山）", desc: "八萬個紅色開運不倒翁散佈山林岩壁與石階，壯觀紅葉如詩如畫。", transit: "🚶 箕面山步道或專車至瀑布" },
          { time: "13:00", loc: "minoo", title: "3. 箕面大瀑布 ＆ 楓葉天婦羅", desc: "名列日本瀑布百選，品嘗傳承千年將真實紅葉裹粉酥炸的特色名物。", transit: "🚇 阪急箕面線 ➔ 梅田（28 分鐘）" },
          { time: "16:00", loc: "dotonbori", title: "4. 梅田百貨商圈（大丸・阪急・Yodobashi）", desc: "全日本最大規模 Yodobashi 梅田店採購 3C，梅田地下街美食。" }
        ],
        routeCoords: [
          [-5, 1.2, 4],     // 難波出發
          [-2, 1.4, 0],     // 梅田樞紐
          [3, 2.5, -8],     // 箕面勝尾寺
          [2, 1.8, -6],     // 箕面瀑布
          [-2, 1.5, 0]      // 梅田百貨
        ]
      },
      {
        badge: "🗺️ 官方五日行程 • 盛欣 11/25 - 11/29 全覽",
        btnClass: "cyan",
        title: "盛欣網絡 2026 關西大阪五日官方行程全覽",
        desc: "高雄直飛關西（AK170/AK171，旅天下承辦）。清水寺、伊根舟屋、天橋立、美山町合掌村、Day 4 全日自由行、臨空城 Outlet。",
        focusLandmark: "kix",
        nodes: [
          { time: "11/25 (三)", loc: "kix", title: "D1：高雄 KHH ✈ 關西 KIX ➔ 世界遺產清水寺", desc: "AK170 (08:30-12:40) 抵達關西機場，造訪清水舞台、二三年坂老街，宿京都。", transit: "🚌 專車直達京都" },
          { time: "11/26 (四)", loc: "kyoto", title: "D2：伊根灣舟屋搭船 ➔ 日本三景天橋立纜車", desc: "米其林星級伊根舟屋餵海鷗，搭纜車上傘松公園俯瞰「升天之龍」，宿京都。", transit: "🚌 丹後半島景觀線" },
          { time: "11/27 (五)", loc: "osaka_castle", title: "D3：美山町茅葺之里合掌村 ➔ 心齋橋道頓堀", desc: "探訪三大合掌村秘境美山町，下午進駐大阪五星飯店，心齋橋自由漫步吃拉麵。", transit: "🚌 移轉大阪市區" },
          { time: "11/28 (六)", loc: "dotonbori", title: "D4：大阪全日自由活動（Plan A vs Plan B vs Plan C）", desc: "完全自由探索！可選歷史文化線、海遊館溫泉線或勝尾寺賞楓，宿大阪。", transit: "🚇 大眾運輸一日券全日自由跑" },
          { time: "11/29 (日)", loc: "kix", title: "D5：臨空城 Outlet ➔ 關西 KIX ✈ 高雄 KHH", desc: "臨空城掃貨最後衝刺，搭乘 AK171 (13:45-16:00) 平安返抵高雄小港。", transit: "✈️ 賦歸台灣" }
        ],
        routeCoords: [
          [9, 1.2, 7],     // 關西機場
          [-6, 1.8, -7],   // 京都清水寺
          [-5, 2.2, -10],  // 天橋立/伊根
          [0, 2.0, -8],    // 美山町
          [1, 2.2, -1],    // 大阪城
          [-5, 1.5, 4],    // 心齋橋道頓堀
          [9, 1.2, 7]      // 關西機場回程
        ]
      }
    ];

    // --- 3D 地標清單 ---
    const LANDMARKS = [
      { id: "kix", name: "關西國際機場 (KIX)", pos: [9, 1.2, 7], color: 0x06b6d4, icon: "✈️" },
      { id: "kyoto", name: "京都古都特區 (清水寺/二三年坂)", pos: [-6, 1.8, -7], color: 0xef4444, icon: "⛩️" },
      { id: "osaka_castle", name: "大阪城 ＆ 歷史博物館", pos: [1, 2.2, -1], color: 0x10b981, icon: "🏯" },
      { id: "dotonbori", name: "道頓堀・難波電器街", pos: [-5, 1.5, 4], color: 0xf59e0b, icon: "🏙️" },
      { id: "harukas", name: "阿倍野 HARUKAS 300 高空夜景", pos: [-1.5, 3.6, 2.8], color: 0xfbbf24, icon: "🌃" },
      { id: "bay_kaiyukan", name: "大阪港・海遊館・住之江溫泉", pos: [6, 1.4, 2], color: 0x38bdf8, icon: "🦈" },
      { id: "minoo", name: "箕面勝尾寺・達摩賞楓", pos: [3, 2.4, -8], color: 0xf43f5e, icon: "🍁" }
    ];

    let currentPlanIdx = 0;
    let selectedLandmark = "osaka_castle";

    // --- Three.js 初始化 ---
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080c14);
    scene.fog = new THREE.FogExp2(0x080c14, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(22, 20, 26);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.15; // 限制不翻入地底
    controls.minDistance = 8;
    controls.maxDistance = 60;
    controls.target.set(0, 1.5, 0);

    // 光照系統
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.65);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(16, 25, 14);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const amberLight = new THREE.PointLight(0xf59e0b, 1.6, 32);
    amberLight.position.set(2, 6, 2);
    scene.add(amberLight);

    // --- 3D 模型群組 ---
    const islandGroup = new THREE.Group();
    scene.add(islandGroup);

    // 1. 六角階梯浮島地表
    const groundGeo = new THREE.CylinderGeometry(19, 20, 2, 6);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8, metalness: 0.2 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -1;
    ground.receiveShadow = true;
    islandGroup.add(ground);

    const baseGeo = new THREE.CylinderGeometry(20, 18, 3.5, 6);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x070b12, roughness: 0.95 });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.y = -3.5;
    islandGroup.add(base);

    const grid = new THREE.GridHelper(34, 24, 0xf59e0b, 0x1e293b);
    grid.position.y = 0.02;
    grid.material.opacity = 0.4;
    grid.material.transparent = true;
    islandGroup.add(grid);

    // 2. 地標：關西國際機場 (KIX)
    const kixGroup = new THREE.Group();
    kixGroup.position.set(9, 0, 7);
    const runway = new THREE.Mesh(new THREE.BoxGeometry(7.5, 0.12, 1.8), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
    runway.receiveShadow = true;
    kixGroup.add(runway);
    // AirAsia 客機
    const plane = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
    plane.rotation.z = Math.PI / 2;
    plane.rotation.y = -Math.PI / 6;
    plane.position.set(-0.8, 0.55, 0);
    const wings = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 1.4), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    wings.position.set(-0.8, 0.55, 0);
    kixGroup.add(plane, wings);
    islandGroup.add(kixGroup);

    // 3. 地標：大阪城天守閣 (Osaka Castle)
    const castleGroup = new THREE.Group();
    castleGroup.position.set(1, 0, -1);
    const stoneBase = new THREE.Mesh(new THREE.ConeGeometry(2.6, 1.2, 4), new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 }));
    stoneBase.rotation.y = Math.PI / 4;
    stoneBase.position.y = 0.6;
    const c1 = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 1.8), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
    c1.position.y = 1.4;
    const r1 = new THREE.Mesh(new THREE.ConeGeometry(2.1, 0.45, 4), new THREE.MeshStandardMaterial({ color: 0x059669 }));
    r1.rotation.y = Math.PI / 4;
    r1.position.y = 1.9;
    const c2 = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.7, 1.3), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
    c2.position.y = 2.3;
    const r2 = new THREE.Mesh(new THREE.ConeGeometry(1.5, 0.5, 4), new THREE.MeshStandardMaterial({ color: 0x059669 }));
    r2.rotation.y = Math.PI / 4;
    r2.position.y = 2.85;
    const goldTop = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.9 }));
    goldTop.position.y = 3.25;
    castleGroup.add(stoneBase, c1, r1, c2, r2, goldTop);
    islandGroup.add(castleGroup);

    // 4. 地標：阿倍野 HARUKAS 300 摩天大樓
    const harukasGroup = new THREE.Group();
    harukasGroup.position.set(-1.5, 0, 2.8);
    const harukasMesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 4.6, 1.1),
      new THREE.MeshStandardMaterial({ color: 0x1e3a8a, metalness: 0.8, roughness: 0.2, transparent: true, opacity: 0.88 })
    );
    harukasMesh.position.y = 2.3;
    const harukasTop = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.3, 0.8),
      new THREE.MeshBasicMaterial({ color: 0xfbbf24 })
    );
    harukasTop.position.y = 4.75;
    harukasGroup.add(harukasMesh, harukasTop);
    islandGroup.add(harukasGroup);

    // 5. 地標：道頓堀商圈與電器街
    const dotonGroup = new THREE.Group();
    dotonGroup.position.set(-5, 0, 4);
    const bldColors = [0x3b82f6, 0x06b6d4, 0x8b5cf6, 0xf59e0b];
    for (let i = 0; i < 4; i++) {
      const h = 2.4 + (i % 3) * 1.3;
      const bld = new THREE.Mesh(new THREE.BoxGeometry(0.9, h, 0.9), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 }));
      bld.position.set((i % 2) * 1.3 - 0.7, h / 2, Math.floor(i / 2) * 1.4 - 0.7);
      const glow = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.1, 0.85), new THREE.MeshBasicMaterial({ color: bldColors[i] }));
      glow.position.set((i % 2) * 1.3 - 0.7, h + 0.05, Math.floor(i / 2) * 1.4 - 0.7);
      dotonGroup.add(bld, glow);
    }
    islandGroup.add(dotonGroup);

    // 6. 地標：大阪港海遊館 ＆ 天保山
    const bayGroup = new THREE.Group();
    bayGroup.position.set(6, 0, 2);
    const aqua = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.6, 1.4, 8), new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.6, roughness: 0.3 }));
    aqua.position.y = 0.7;
    const wheel = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.08, 8, 24), new THREE.MeshStandardMaterial({ color: 0x38bdf8 }));
    wheel.position.set(0, 1.9, 0);
    wheel.rotation.y = Math.PI / 4;
    bayGroup.add(aqua, wheel);
    islandGroup.add(bayGroup);

    // 7. 地標：箕面勝尾寺與紅葉山林
    const minooGroup = new THREE.Group();
    minooGroup.position.set(3, 0, -8);
    const hill = new THREE.Mesh(new THREE.ConeGeometry(2.4, 1.8, 6), new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.8 }));
    hill.position.y = 0.9;
    const daruma = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3 }));
    daruma.position.set(0, 2.0, 0);
    minooGroup.add(hill, daruma);
    islandGroup.add(minooGroup);

    // 8. 地標：京都特區 (清水寺與鳥居)
    const kyotoGroup = new THREE.Group();
    kyotoGroup.position.set(-6, 0, -7);
    const toriiMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 });
    const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.4), toriiMat);
    p1.position.set(-0.8, 1.2, 0);
    const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.4), toriiMat);
    p2.position.set(0.8, 1.2, 0);
    const topBar = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.2, 0.3), toriiMat);
    topBar.position.set(0, 2.3, 0);
    kyotoGroup.add(p1, p2, topBar);
    islandGroup.add(kyotoGroup);

    // --- 動態光流軌跡線 ---
    let currentRouteMesh = null;
    let trainMesh = null;
    let routeCurve = null;
    let trainT = 0;

    function buildRouteLine(coords, colorHex) {
      if (currentRouteMesh) islandGroup.remove(currentRouteMesh);
      if (trainMesh) islandGroup.remove(trainMesh);

      const vPoints = coords.map(c => new THREE.Vector3(c[0], c[1], c[2]));
      routeCurve = new THREE.CatmullRomCurve3(vPoints);
      const sampled = routeCurve.getPoints(80);

      const lineGeo = new THREE.BufferGeometry().setFromPoints(sampled);
      const lineMat = new THREE.LineDashedMaterial({
        color: colorHex,
        dashSize: 0.8,
        gapSize: 0.4,
        linewidth: 2.5
      });
      currentRouteMesh = new THREE.Line(lineGeo, lineMat);
      currentRouteMesh.computeLineDistances();
      islandGroup.add(currentRouteMesh);

      const tGeo = new THREE.SphereGeometry(0.28, 12, 12);
      const tMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      trainMesh = new THREE.Mesh(tGeo, tMat);
      islandGroup.add(trainMesh);
      trainT = 0;
    }

    // --- HUD 2D/3D 投影系統 ---
    const hudContainer = document.getElementById("hud-container");
    const hudElements = {};

    LANDMARKS.forEach(lm => {
      const el = document.createElement("div");
      el.className = "hud-marker";
      el.id = `hud-${lm.id}`;
      el.innerHTML = `
        <div class="hud-tag">
          <span>${lm.icon}</span>
          <span>${lm.name}</span>
        </div>
        <div class="hud-pin"></div>
      `;
      el.onclick = () => {
        focusLandmark(lm.id);
      };
      hudContainer.appendChild(el);
      hudElements[lm.id] = { el, pos: new THREE.Vector3(...lm.pos) };
    });

    const tempV = new THREE.Vector3();
    function updateHUD() {
      LANDMARKS.forEach(lm => {
        const item = hudElements[lm.id];
        tempV.copy(item.pos);
        tempV.applyMatrix4(islandGroup.matrixWorld);

        tempV.project(camera);
        if (tempV.z > 1) {
          item.el.style.opacity = "0";
          return;
        }

        const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-(tempV.y * 0.5) + 0.5) * window.innerHeight;

        item.el.style.left = `${x}px`;
        item.el.style.top = `${y}px`;
        item.el.style.opacity = "1";
      });
    }

    // --- 鏡頭平滑飛行對焦 ---
    let targetCameraPos = new THREE.Vector3();
    let targetLookAt = new THREE.Vector3();
    let isMovingCamera = false;

    function focusLandmark(id) {
      selectedLandmark = id;
      const lm = LANDMARKS.find(item => item.id === id);
      if (!lm) return;

      Object.keys(hudElements).forEach(key => {
        hudElements[key].el.classList.toggle("active", key === id);
      });

      const lx = lm.pos[0];
      const ly = lm.pos[1];
      const lz = lm.pos[2];

      targetLookAt.set(lx, ly, lz);
      targetCameraPos.set(lx + 9, ly + 8, lz + 10);
      isMovingCamera = true;
    }

    // --- 方案切換核心邏輯 ---
    function switchPlan(index) {
      currentPlanIdx = index;
      const p = PLANS[index];

      document.querySelectorAll(".plan-btn").forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
      });

      const badgeEl = document.getElementById("planBadge");
      badgeEl.innerText = p.badge;
      if (index === 0) badgeEl.style.color = "var(--accent-gold)";
      else if (index === 1) badgeEl.style.color = "#f43f5e";
      else if (index === 2) badgeEl.style.color = "#10b981";
      else badgeEl.style.color = "#06b6d4";

      document.getElementById("planTitle").innerText = p.title;
      document.getElementById("planDesc").innerText = p.desc;

      const timelineEl = document.getElementById("timelineList");
      timelineEl.innerHTML = "";
      p.nodes.forEach((n, i) => {
        const item = document.createElement("div");
        item.className = "timeline-item" + (i === 0 ? " active" : "");
        item.innerHTML = `
          <div class="time-tag">${n.time}</div>
          <div class="time-content">
            <div class="node-title">${n.title}</div>
            <div class="node-desc">${n.desc}</div>
            ${n.transit ? `<div class="node-transit">🚇 ${n.transit}</div>` : ""}
          </div>
        `;
        item.onclick = () => {
          document.querySelectorAll(".timeline-item").forEach(el => el.classList.remove("active"));
          item.classList.add("active");
          focusLandmark(n.loc);
        };
        timelineEl.appendChild(item);
      });

      const colors = [0xf59e0b, 0xf43f5e, 0x10b981, 0x06b6d4];
      buildRouteLine(p.routeCoords, colors[index]);

      focusLandmark(p.focusLandmark);
    }

    function toggleDetailsPanel() {
      const panel = document.getElementById("detailsPanel");
      const btn = document.getElementById("btnTogglePanel");
      panel.classList.toggle("minimized");
      btn.innerText = panel.classList.contains("minimized") ? "展開 ▴" : "收合 ▾";
    }

    switchPlan(0);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      if (routeCurve && trainMesh) {
        trainT = (trainT + 0.002) % 1;
        const pt = routeCurve.getPoint(trainT);
        trainMesh.position.copy(pt);
      }

      if (isMovingCamera) {
        camera.position.lerp(targetCameraPos, 0.05);
        controls.target.lerp(targetLookAt, 0.05);
        if (camera.position.distanceTo(targetCameraPos) < 0.1) {
          isMovingCamera = false;
        }
      }

      controls.update();
      updateHUD();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.querySelectorAll("[data-hermes-send]").forEach(btn => {
      btn.addEventListener("click", () => {
        const text = btn.getAttribute("data-hermes-send");
        if (window.hermes && typeof window.hermes.send === "function") {
          window.hermes.send(text);
        } else {
          console.log("[Hermes Send]:", text);
        }
      });
    });
  </script>
</body>
</html>
